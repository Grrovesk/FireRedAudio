[project]
name = "fireredaudio"
version = "0.1.0"
description = "FireRedAudio inference: ASR, audio understanding, TTS, speech editing, voice design"
readme = "README.md"
requires-python = ">=3.10,<3.11"

dependencies = [
    "torch==2.13.0",
    "torchaudio==2.11.0",
    "torchcodec==0.16.0",
    "soundfile==0.13.1",
    "transformers==5.15.1",
    "numpy==2.5.2",
    "einops==0.8.2",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
accel = [
    "flash-linear-attention==0.5.2",
    "liger-kernel==0.8.2",
]
accel-build = [
    "causal-conv1d==1.6.2.post1",
    "flash-attn==2.8.3",
]
quantization = [
    "accelerate>=1.0.0",
    "bitsandbytes>=0.46.0",
]

[dependency-groups]
tools = ["tqdm=4.70.0"]

[tool.uv]
package = false

[tool.uv.extra-build-dependencies]
causal-conv1d = [{ requirement = "torch", match-runtime = true }]
flash-attn = [{ requirement = "torch", match-runtime = true }]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu132" }]
torchaudio = [{ index = "pytorch-cu132" }]
torchcodec = [{ index = "pytorch-cu132" }]
